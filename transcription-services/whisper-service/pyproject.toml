[project]
name = "whisper-transcription-service"
version = "1.0.0"
description = "Local Whisper transcription service for ARI Stasi Server"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
