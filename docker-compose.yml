# AriLink — Docker Compose
#
# Quick start:
#   docker compose up
#
# With GPU (Parakeet STT + Kokoro TTS):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# With Rust RTP server:
#   docker compose --profile rust-rtp up
#
# Dashboard:  http://localhost:3011
# SIP phone:  localhost:5060  (extension 1001, password demo1001)

services:

  # ─── Asterisk PBX ───
  asterisk:
    build: ./docker/asterisk
    container_name: arilink-asterisk
    environment:
      - ASTERISK_LOGIN=${ASTERISK_LOGIN:-arilink}
      - ASTERISK_PASSWORD=${ASTERISK_PASSWORD:-arilink123}
      - STASIS_APP_NAME=${STASIS_APP_NAME:-stasis-app}
      - EXTERNAL_IP=${EXTERNAL_IP:-}    # Host IP for WebRTC NAT traversal (e.g. 192.168.1.100)
    ports:
      - "5060:5060/udp"       # SIP signaling
      - "8088:8088"           # ARI HTTP + WebSocket (SIP.js)
      - "5060:5060/tcp"       # SIP signaling (TCP)
      - "10000-10100:10000-10100/udp"  # RTP media (reduced range for demo)
    volumes:
      - ./docker/asterisk/sounds:/var/lib/asterisk/sounds    # Bind mount — visible on host + shared with arilink
      - ./docker/asterisk/moh:/var/lib/asterisk/moh
      - ./docker/asterisk/spool:/var/spool/asterisk
    networks:
      - arilink
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'ari show status' | grep -q 'Enabled'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Parakeet Transcription Service (CPU) ───
  parakeet:
    build: ./transcription-services/parakeet-service
    container_name: arilink-parakeet
    environment:
      - TRANSCRIPTION_DEVICE=cpu
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}
    ports:
      - "5000:5000"
    volumes:
      - parakeet-cache:/root/.cache    # Model downloads persist across restarts
    networks:
      - arilink
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',5000)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s   # Model loading can take a few minutes on first run

  # ─── Kokoro TTS Service (CPU) ───
  kokoro:
    build: ./tts-services/kokoro-service
    container_name: arilink-kokoro
    environment:
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_SPEED=${TTS_SPEED:-1.0}
      - TTS_LANG=${TTS_LANG:-a}
    ports:
      - "5001:5001"
    volumes:
      - kokoro-cache:/root/.cache     # Model downloads persist across restarts
    networks:
      - arilink
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',5001)); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s   # Model loading can take a few minutes on first run

  # ─── AriLink Dashboard + Engine ───
  arilink:
    build: .
    container_name: arilink-app
    environment:
      - PBX_IP=asterisk
      - ASTERISK_LOGIN=${ASTERISK_LOGIN:-arilink}
      - ASTERISK_PASSWORD=${ASTERISK_PASSWORD:-arilink123}
      - STASIS_APP_NAME=${STASIS_APP_NAME:-stasis-app}
      - TRANSCRIPTION_SERVICES=ws://parakeet:5000
      - TTS_SERVICE=ws://kokoro:5001
      - LISTENER_SERVER=0.0.0.0:8000
      - EXTERNAL_HOST=arilink
      - AUTO_START_TRANSCRIPTION=false
      - SPEECH_LANG=${SPEECH_LANG:-en-US}
      - DEFAULT_ASSISTANT=${DEFAULT_ASSISTANT:-ivr-transfer}
      - USE_RUST_RTP=${USE_RUST_RTP:-false}
      - RUST_SERVER_URL=http://rust-rtp:9900
      - RTP_TTS_PORT=8001
      - WSS_PORT=${WSS_PORT:-3044}
      - PORT=3011
      - NITRO_PORT=3011
      - SSH_HOST=                              # Empty = local filesystem (shared bind mounts with Asterisk)
      - DOCKER_MANAGEMENT=true                  # Enable container management from dashboard
    ports:
      - "3011:3011"           # Dashboard UI + API
      # Note: port 8000/udp handled by rust-rtp when --profile rust-rtp is active
      # For non-Rust mode, Asterisk reaches arilink:8000 via Docker network (no host mapping needed)
    volumes:
      - ./data:/app/data      # SQLite call history database
      - ./logs:/app/logs      # Log files
      - ./docker/asterisk/sounds:/var/lib/asterisk/sounds    # Same bind mount as Asterisk
      - ./docker/asterisk/moh:/var/lib/asterisk/moh
      - ./docker/asterisk/spool:/var/spool/asterisk
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket for container management
    depends_on:
      asterisk:
        condition: service_healthy
      parakeet:
        condition: service_started    # Don't wait for healthy — model takes time to load
    networks:
      - arilink
    restart: unless-stopped

  # ─── Rust RTP Server (optional) ───
  rust-rtp:
    build: ./rust-rtp-server
    container_name: arilink-rust-rtp
    environment:
      - RUST_LOG=info
      - RTP_LISTEN_ADDR=0.0.0.0:8000
      - RTP_TTS_ADDR=0.0.0.0:8001
      - TRANSCRIPTION_SERVICES=ws://parakeet:5000
    ports:
      - "9900:9900"           # API (HTTP)
      - "8000:8000/udp"       # RTP IN  (Asterisk → Rust mic audio)
      - "8001:8001/udp"       # RTP OUT (Rust → Asterisk TTS audio)
    networks:
      - arilink
    restart: unless-stopped
    profiles:
      - rust-rtp

networks:
  arilink:
    driver: bridge

volumes:
  parakeet-cache:
  kokoro-cache:
