; AriLink Docker — PJSIP Configuration
;
; Minimal config with one demo extension (1001) for testing.
; Add more extensions or SIP trunks as needed.

; ─── Transport ───
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ─── Demo Extension 1001 ───
; Register a softphone (Zoiper, Linphone) to test calls
[1001]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
allow=slin16
auth=auth1001
aors=1001
callerid="Demo Phone" <1001>

[auth1001]
type=auth
auth_type=userpass
password=demo1001
username=1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
