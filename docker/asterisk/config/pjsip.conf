; AriLink Docker — PJSIP Configuration
;
; Minimal config with one demo extension (1001) for testing.
; Add more extensions or SIP trunks as needed.

; ─── Transports ───
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ─── Demo Extension 1001 (WebRTC) ───
; Use from the built-in dashboard softphone
[1001]
type=endpoint
webrtc=yes
context=from-internal
disallow=all
allow=opus
allow=g722
allow=ulaw
allow=alaw
auth=auth1001
aors=1001
callerid="Dashboard Phone" <1001>
dtls_auto_generate_cert=yes

[auth1001]
type=auth
auth_type=userpass
password=demo1001
username=1001

[1001]
type=aor
max_contacts=1
remove_existing=yes

; ─── Demo Extension 1002 (UDP) ───
; Use from MicroSIP, Zoiper, or other SIP softphone
[1002]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=auth1002
aors=1002
callerid="SIP Phone" <1002>

[auth1002]
type=auth
auth_type=userpass
password=demo1002
username=1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
