; AriLink Docker — RTP Configuration
;
; Restrict RTP port range to match Docker port mapping.
; 101 ports = ~50 simultaneous calls (each call needs 2 RTP ports).

[general]
rtpstart=10000
rtpend=10100
; Disable strict RTP to allow ExternalMedia bidirectional audio
strictrtp=no

; ICE support for WebRTC NAT traversal
icesupport=yes

; NOTE: stunaddr is intentionally omitted here.
; When ice_host_candidates section is used (injected by entrypoint.sh),
; stunaddr must NOT be set — they conflict.
; If EXTERNAL_IP is not available, entrypoint.sh adds stunaddr as fallback.

; [ice_host_candidates] section is injected by entrypoint.sh at runtime
; Maps container IP → host IP so browsers can reach Asterisk's RTP
