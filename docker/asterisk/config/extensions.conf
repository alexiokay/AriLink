; AriLink Docker — Dialplan Configuration
;
; All incoming calls are routed to the Stasis application.
; The AriLink Engine takes over from there.

[general]
static=yes
writeprotect=no

; ─── Stasis Application Context ───
; Incoming calls from trunks or internal routing land here
[stasis-app]
exten => _X.,1,NoOp(AriLink: Incoming ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(__STASIS_APP__,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

; Handle international format (+country code)
exten => _+.,1,NoOp(AriLink: Incoming intl ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(__STASIS_APP__,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

; ─── Internal Extensions & Outbound Routing ───
; Used by Local/${number}@from-internal origination (transfers, auto-dialer)
[from-internal]
; Demo extension — dial directly via PJSIP
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

; Standard numbers — route through Stasis
exten => _X.,1,NoOp(Outbound: ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(stasis-app,${EXTEN},1)

; International format (+country code)
exten => _+.,1,NoOp(Outbound intl: ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(stasis-app,${EXTEN},1)

; ─── Trunk Calls ───
; Incoming calls from SIP trunks
[from-trunk]
exten => _X.,1,NoOp(Trunk: ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(stasis-app,${EXTEN},1)

exten => _+.,1,NoOp(Trunk intl: ${CALLERID(num)} -> ${EXTEN})
 same => n,Goto(stasis-app,${EXTEN},1)
